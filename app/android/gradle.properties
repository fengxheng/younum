org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 Kotlin 增量编译。
#
# 原因：工程在 D 盘，而 pub 缓存在 C:\Users\liuxu\AppData\Local\Pub\Cache。
# Kotlin 的增量缓存用 RelocatableFileToPathConverter 计算「相对工程根」的路径，
# 跨盘符时 relativeTo 会抛
#   IllegalArgumentException: this and base files have different roots
# 导致 Kotlin 守护进程编译失败（Could not close incremental caches）。
#
# 本工程只有 MainActivity 与 shared_preferences 的少量 Kotlin 代码，
# 关闭增量编译的代价可忽略。
# 若将来把工程放到 C 盘（与 pub 缓存同盘），可以删掉这一行。
kotlin.incremental=false
